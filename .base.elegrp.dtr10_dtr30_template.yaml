substitutions:
  default_log_level: "INFO"
  toggle_log_level_timeout_hours: "24"
  syslog_server_port: "514"
  syslog_log_level: "INFO"
  syslog_time_esphome_id: "id_time_esphome_component"
  
esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  project:
    name: elegrp.dtr10_dtr30_template
    version: "1.4mqtt"
  platformio_options:
    build_flags:
      - -DLWIP_DHCP_DOES_ACD_CHECK=0 # fix for https://github.com/libretiny-eu/libretiny/issues/316

bk72xx:
  board: cb2s

external_components:
  # use rtttl and dfplayer from ESPHome's dev branch in GitHub
  - source:
      type: git
      url: https://github.com/bennydiamond/esphome
      ref: tuya_cmd_public
    components: [ tuya ]
      
