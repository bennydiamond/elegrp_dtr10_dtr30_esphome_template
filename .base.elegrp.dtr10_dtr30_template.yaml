mqtt:
  id: id_mqtt_broker
  broker: ${mqtt_broker_ip}
  port: ${mqtt_broker_port}
  username: ${mqtt_username}
  password: ${mqtt_password}
  topic_prefix: "esphome/${device_name}"
  discovery_unique_id_generator: mac
  on_disconnect:
    if:
      condition:
        for:
          time: 10min
          condition:
            not:
              mqtt.connected:
      then:
        - number.set:
            id: indicator_brightness
            value: ${indicator_brightness_when_offline_percent}

ota:
  - platform: esphome
    id: id_esphome_ota

captive_portal:
  id: id_captive_portal

web_server:
  id: id_web_server
  include_internal: True
  
mdns:
  id: id_mdns
  disabled: True
  
debug:
  id: id_debug
  update_interval: 30s

# Enable logging
logger:
  id: id_logger
  level: DEBUG
  initial_level: ${default_log_level}
  baud_rate: 0 # Disable log to uart because using Uart for TuyaMCU

udp:
  - id: id_udp_syslog_server
    addresses: ${syslog_server_ip}

syslog:
  udp_id: id_udp_syslog_server
  time_id: ${syslog_time_esphome_id} # must be defined in local yaml config
  port: ${syslog_server_port}
  strip: true # remove color code
  level: ${syslog_log_level}
  
uart:
  rx_pin: RX1
  tx_pin: TX1
  baud_rate: 9600

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
  - platform: internal_temperature
    name: "CPU Temperature"
    id: id_sensor_internal_temperature
    entity_category: diagnostic
  - platform: uptime
    type: seconds
    name: Uptime
  - platform: debug
    free:
      name: "Heap Free"
    loop_time:
      name: "Loop Time"
#  - platform: homeassistant
#    name: "HA desired indicator brightness value"
#    internal: True # Explicitely defined but set like that for obvious reasons!
#    entity_id: input_number.dimmer_switch_indicator_level_main_rdc
  - platform: mqtt_subscribe
    name: "HA desired indicator brightness value"
    topic: ${indicator_brightness_topic}
    on_value: 
      then:
        - number.set:
            id: indicator_brightness
            value: !lambda "return x;"

binary_sensor:
  - platform: gpio
    name: "Paddle up"
    id: input_paddle_up_button
    internal: True # not wired for now
    pin:
      number: P6
      inverted: True
      mode:
        input: true
        pullup: false
    filters:
      settle: 50ms
    on_multi_click: 
      - timing: 
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "up_singleclick"
      - timing:
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for ${multiclick_min_length} to ${multiclick_max_length}
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "up_doubleclick"
      - timing: 
          - ON for at least ${longpress_min_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "up_longpress"
      - timing: 
          - ON for at least ${longpress_reboot_timeout}
        then:
          - button.press:
              id: id_button_device_restart_safe_mode

  - platform: gpio
    name: "Paddle down"
    id: input_paddle_down_button
    internal: True # not wired for now
    pin:
      number: P23
      inverted: True
      mode:
        input: true
        pullup: false
    filters:
      settle: 50ms
    on_multi_click: 
      - timing: 
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "down_singleclick"
      - timing:
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for ${multiclick_min_length} to ${multiclick_max_length}
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "down_doubleclick"
      - timing: 
          - ON for at least ${longpress_min_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "down_longpress"
      - timing: 
          - ON for at least ${longpress_reboot_timeout}
        then:
          - button.press:
              id: id_button_device_restart


